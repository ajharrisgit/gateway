<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJSU Travel Applications Suite</title>
  <meta name="description" content="AJSU Travel Apps Suite - Colorado and National Travel Reimbursement, Mileage, and Per Diem Estimators.">
  <!-- The gateway lives in travel_gateway.html. This file is the deploy root and
       forwards to it, so there is one portal to maintain rather than two copies
       that drift apart. -->
  <meta http-equiv="refresh" content="0; url=travel_gateway.html">
  <link rel="canonical" href="travel_gateway.html">
  <!-- Netlify and Cloudflare get the real header from `_headers`. GitHub Pages
       supports no header config at all, so this tag is this page's only CSP on
       that host -- weaker than a header (it cannot set frame-ancestors or
       X-Frame-Options), which is a known and accepted gap for that host, not
       an oversight. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b1120;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <p>Opening the AJSU Travel Gateway. <a href="travel_gateway.html">Continue</a> if it does not load.</p>
  <script src="index.js"></script>
</body>
</html>
