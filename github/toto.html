om your daily per diem claim. Use the "Meals were provided" checkbox to mark which meals were provided on each day. The app deducts the published meal component amount. A day\'s claim cannot be reduced below the incidental expense floor.'], ['What is the travel incidental allowance for same-day trips?', 'The incidental expense portion of your daily per diem covers tips and similar minor out-of-pocket expenses during travel. The FTR does not provide a same-day incidental allowance by default. If your agency authorizes this, you may check the incidental allowance box. Confirm eligibility with your travel coordinator.'], ['Can I submit this estimate directly as my travel claim?', 'No. This app produces planning estimates to help you prepare. Your agency has its own voucher submission process and controller requirements. Use the exports as preparation records alongside your agency\'s required forms.'], ['Is my data saved between sessions?', 'Your trip entries and mileage log are not saved. They exist only in your browser tab for the current session, and closing or refreshing the page clears them. Use Copy Breakdown, Export CSV Log, or Export as PDF / Print Log to save your work before closing. Your claimant details and rate selections are remembered, so you do not have to retype them. What is remembered is stored only in this browser on this device, and clearing your browser data removes it.'], ['Which rate year should I select for my mileage?', 'Select the Calendar Year that matches your travel dates. For trips January 1-December 31, 2025, use CY2025. For trips January 1-December 31, 2026, use CY2026. The app automatically selects the matching year when you enter a Travel Start Date.'], ['Can I calculate a trip or mileage log from 2025?', 'Yes. The CY2025 Federal GSA/IRS mileage rate ($0.70/mile) is available. Per diem rates for FY2025 are identical to FY2026 because GSA held rates flat. Enter the 2025 travel dates and confirm the rate dropdown shows CY2025 rates.'], [
