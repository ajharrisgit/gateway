<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJSU Travel Gateway</title>
  <meta name="description" content="AJSU Travel Apps Suite - Travel Reimbursement, Mileage, and Per Diem Estimators.">
  <!-- Local copies, built by vendor_fonts.py. The gateway used to fetch these
       from Google on every view, which is a request the page does not need to
       make and an IP address it does not need to disclose. It also asked for
       JetBrains Mono, which it never used a single glyph of. -->
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <!-- One manifest and one service worker for the whole suite. The three apps
       each shipped their own, every one of them claiming the domain root, so
       three could not coexist on one origin. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1120">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Netlify and Cloudflare get the real header from `_headers`. GitHub Pages
       supports no header config at all, so this tag is this page's only CSP on
       that host -- weaker than a header (it cannot set frame-ancestors or
       X-Frame-Options), which is a known and accepted gap for that host, not
       an oversight. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="gateway.css">
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-badge">AJSU</div>
      <div class="title-group">
        <h1>Travel Applications Suite</h1>
        <p>Travel Reimbursement, Mileage and Per Diem Tools</p>
      </div>
    </div>

    <div class="nav-tabs" role="tablist" aria-label="Travel Applications">
      <button class="tab-btn active" data-app="tata">
        <span>tata</span> <span class="badge">Estimator</span>
      </button>
      <button class="tab-btn" data-app="tito">
        <span>tito</span> <span class="badge">Travel Worksheet</span>
      </button>
      <button class="tab-btn" data-app="toto">
        <span>toto</span> <span class="badge">National GSA</span>
      </button>
    </div>

    <div class="action-links">
      <a id="direct-link" class="btn-link" href="tata.html" target="_blank" rel="noopener">Open App in New Tab</a>
    </div>
  </header>

  <main>
    <iframe id="app-frame" src="tata.html" title="Travel App Container"></iframe>
  </main>

  <!-- The same three documents under the same three names as each app in the suite. -->
  <footer class="policy-bar">
    <span>(c) 2026 AJSU | Planning estimates only</span>
    <button type="button" data-policy="terms">Terms of Service</button>
    <button type="button" data-policy="privacy">Privacy Notice</button>
    <button type="button" data-policy="disclaimer">Disclaimer</button>
  </footer>

  <div id="policy-overlay" role="dialog" aria-modal="true" aria-labelledby="policy-title">
    <div id="policy-card">
      <h2 id="policy-title"></h2>
      <div id="policy-body"></div>
      <!-- A visible Close matching the three apps. Escape and a backdrop click
           already closed this, but neither is discoverable, and on a touch
           screen the backdrop tap was the only way out of a full-height
           document. -->
      <div id="policy-actions">
        <button type="button" id="policy-close">Close</button>
      </div>
    </div>
  </div>

  <script src="gateway.js"></script>
</body>
</html>
